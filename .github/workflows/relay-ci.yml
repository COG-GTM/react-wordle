name: Relay CI

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
